        const width = window.innerWidth;

        const height = window.innerHeight;

        const svg = d3.select("#network")

            .append("svg")

            .attr("width", width)

            .attr("height", height);

        const simulation = d3.forceSimulation(nodes)

            .force("link", d3.forceLink(links).id(d => d.id).distance(80))

            .force("charge", d3.forceManyBody().strength(-200))

            .force("center", d3.forceCenter(width / 2, height / 2));

        const link = svg.append("g")

            .selectAll("line")

            .data(links)

            .join("line")

            .attr("class", "link")

            .attr("stroke-width", d => Math.sqrt(d.value / 100));

        const node = svg.append("g")

            .selectAll("circle")

            .data(nodes)

            .join("circle")

            .attr("r", d => d.type === 'hanja' ? 12 : 8)

            .attr("class", d => d.type === 'hanja' ? 'node-hanja' : 'node-hyeonto')

            .call(d3.drag()

                .on("start", dragstarted)

                .on("drag", dragged)

                .on("end", dragended));

        const label = svg.append("g")

            .selectAll("text")

            .data(nodes)

            .join("text")

            .text(d => d.id)

            .attr("font-size", d => d.type === 'hanja' ? 14 : 11)

            .attr("fill", "#000")

            .attr("text-anchor", "middle")

            .attr("dy", d => d.type === 'hanja' ? -18 : -12);

        const tooltip = d3.select(".tooltip");

        node.on("mouseover", function(event, d) {

            const connections = links.filter(l => l.source.id === d.id || l.target.id === d.id);

            tooltip

                .style("display", "block")

                .style("left", (event.pageX + 10) + "px")

                .style("top", (event.pageY + 10) + "px")

                .html(`<strong>${d.id}</strong> (${d.type})<br>연결: ${connections.length}개`);

        })

        .on("mouseout", function() {

            tooltip.style("display", "none");

        });

        simulation.on("tick", () => {

            link

                .attr("x1", d => d.source.x)

                .attr("y1", d => d.source.y)

                .attr("x2", d => d.target.x)

                .attr("y2", d => d.target.y);

            node

                .attr("cx", d => d.x)

                .attr("cy", d => d.y);

            label

                .attr("x", d => d.x)

                .attr("y", d => d.y);

        });

        function dragstarted(event) {

            if (!event.active) simulation.alphaTarget(0.3).restart();

            event.subject.fx = event.subject.x;

            event.subject.fy = event.subject.y;

        }

        function dragged(event) {

            event.subject.fx = event.x;

            event.subject.fy = event.y;

        }

        function dragended(event) {

            if (!event.active) simulation.alphaTarget(0);

            event.subject.fx = null;

            event.subject.fy = null;

        }

    </script>
