<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서종 메타데이터 편집기 v3</title>
    <style>
        :root {
            --bg: #0d1117;
            --bg-card: #161b22;
            --bg-input: #21262d;
            --border: #30363d;
            --accent: #238636;
            --primary: #58a6ff;
            --danger: #f85149;
            --warning: #d29922;
            --text: #c9d1d9;
            --text-dim: #8b949e;
            --text-bright: #f0f6fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-bright);
        }

        .sidebar-search {
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-search input {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.875rem;
        }

        .sidebar-search input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .sidebar-nav {
            padding: 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            color: var(--text);
            transition: background 0.15s;
        }

        .nav-item:hover {
            background: var(--bg-input);
        }

        .nav-item.active {
            background: rgba(88, 166, 255, 0.15);
            color: var(--primary);
        }

        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            margin-bottom: 2px;
            transition: background 0.15s;
        }

        .list-item:hover {
            background: var(--bg-input);
        }

        .list-item.active {
            background: var(--bg-input);
            border-left: 3px solid var(--primary);
        }

        .list-item-name {
            font-weight: 500;
        }

        .list-item-meta {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .sidebar-footer {
            padding: 12px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
        }

        /* Main Content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .main-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
        }

        .main-header h2 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        /* Buttons */
        .btn {
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-input);
            color: var(--text);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background: var(--border);
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            background: #2ea043;
        }

        .btn-danger {
            background: transparent;
            border-color: var(--danger);
            color: var(--danger);
        }

        .btn-danger:hover {
            background: rgba(248, 81, 73, 0.1);
        }

        .btn-sm {
            padding: 4px 10px;
            font-size: 0.75rem;
        }

        /* Form Elements */
        .form-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .form-section-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 0.875rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-section-body {
            padding: 16px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-row:last-child {
            margin-bottom: 0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input,
        .form-select {
            padding: 8px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.875rem;
        }

        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Tags */
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            min-height: 36px;
            padding: 6px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: rgba(88, 166, 255, 0.15);
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--primary);
        }

        .tag-remove {
            cursor: pointer;
            opacity: 0.7;
            font-size: 1rem;
            line-height: 1;
        }

        .tag-remove:hover {
            opacity: 1;
        }

        .tag-input-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .tag-input-row input,
        .tag-input-row select {
            flex: 1;
        }

        /* Layers */
        .layer-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 8px;
            display: grid;
            grid-template-columns: 120px 1fr 1fr auto;
            gap: 12px;
            align-items: center;
        }

        .layer-card:last-child {
            margin-bottom: 0;
        }

        .layer-type-badge {
            background: var(--bg-input);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.875rem;
            font-weight: 600;
            text-align: center;
        }

        .layer-type-badge.경 {
            border-left: 3px solid #4caf50;
        }

        .layer-type-badge.전 {
            border-left: 3px solid #2196f3;
        }

        .layer-type-badge.주 {
            border-left: 3px solid #ff9800;
        }

        .layer-type-badge.소 {
            border-left: 3px solid #9c27b0;
        }

        .layer-type-badge.집주 {
            border-left: 3px solid #e91e63;
        }

        .layer-type-badge.본문 {
            border-left: 3px solid #607d8b;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 90%;
            max-width: 700px;
            max-height: 90vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .modal-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 20px;
            background: var(--accent);
            color: #fff;
            border-radius: 8px;
            font-weight: 500;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px;
            color: var(--text-dim);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        /* JSON View */
        .json-output {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.8rem;
            white-space: pre-wrap;
            max-height: 400px;
            overflow: auto;
        }
    </style>
</head>

<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>📚 메타데이터 편집기</h1>
            </div>
            <div class="sidebar-search">
                <input type="text" id="searchBox" placeholder="검색...">
            </div>
            <nav class="sidebar-nav">
                <div class="nav-item active" data-view="books">📖 서목</div>
                <div class="nav-item" data-view="people">👤 인물</div>
                <div class="nav-item" data-view="layers">📑 레이어 타입</div>
            </nav>
            <div class="sidebar-list" id="sidebarList"></div>
            <div class="sidebar-footer">
                <button class="btn" onclick="loadFile()">📂 열기</button>
                <button class="btn btn-primary" onclick="exportJSON()">💾 저장</button>
            </div>
        </aside>

        <!-- Main -->
        <main class="main">
            <header class="main-header">
                <h2 id="mainTitle">서목 목록</h2>
                <div>
                    <button class="btn btn-primary" id="addBtn" onclick="openAddModal()">+ 추가</button>
                </div>
            </header>
            <div class="main-content" id="mainContent">
                <div class="empty-state">
                    <div class="empty-state-icon">📚</div>
                    <p>왼쪽에서 항목을 선택하세요</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Book Modal -->
    <div class="modal-overlay" id="bookModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="bookModalTitle">서목 추가</h3>
                <button class="modal-close" onclick="closeBookModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editingBookName">

                <div class="form-section">
                    <div class="form-section-header">기본 정보</div>
                    <div class="form-section-body">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">서목명 *</label>
                                <input type="text" class="form-input" id="bookName" placeholder="예: 논어집주1">
                            </div>
                            <div class="form-group">
                                <label class="form-label">사부 분류</label>
                                <select class="form-select" id="bookSibu">
                                    <option value="經">經 (경부)</option>
                                    <option value="史">史 (사부)</option>
                                    <option value="子">子 (자부)</option>
                                    <option value="集">集 (집부)</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">시대</label>
                                <select class="form-select" id="bookPeriod">
                                    <option value="춘추시대">춘추시대</option>
                                    <option value="전국시대">전국시대</option>
                                    <option value="전한시대">전한시대</option>
                                    <option value="후한시대">후한시대</option>
                                    <option value="위진남북조시대">위진남북조</option>
                                    <option value="당대">당대</option>
                                    <option value="북송시대">북송시대</option>
                                    <option value="남송시대">남송시대</option>
                                    <option value="원대">원대</option>
                                    <option value="명대">명대</option>
                                    <option value="청대">청대</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">세부 연도</label>
                                <input type="text" class="form-input" id="bookPeriodDetail" placeholder="예: 1130-1200">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-section-header">저자</div>
                    <div class="form-section-body">
                        <div class="tags-container" id="authorTags"></div>
                        <div class="tag-input-row">
                            <select class="form-select" id="authorSelect">
                                <option value="">선택...</option>
                            </select>
                            <input type="text" class="form-input" id="authorInput" placeholder="직접 입력">
                            <button class="btn btn-sm" onclick="addAuthor()">추가</button>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-section-header">역자</div>
                    <div class="form-section-body">
                        <div class="tags-container" id="translatorTags"></div>
                        <div class="tag-input-row">
                            <select class="form-select" id="translatorSelect">
                                <option value="">선택...</option>
                            </select>
                            <input type="text" class="form-input" id="translatorInput" placeholder="직접 입력">
                            <button class="btn btn-sm" onclick="addTranslator()">추가</button>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-section-header">
                        <span>텍스트 레이어</span>
                        <button class="btn btn-sm" onclick="addLayer()">+ 레이어 추가</button>
                    </div>
                    <div class="form-section-body" id="layersContainer">
                        <p style="color:var(--text-dim);font-size:0.875rem">다층 텍스트의 경우 레이어를 추가하세요 (예: 경+전, 본문+주석)</p>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeBookModal()">취소</button>
                <button class="btn btn-primary" onclick="saveBook()">저장</button>
            </div>
        </div>
    </div>

    <!-- JSON Modal -->
    <div class="modal-overlay" id="jsonModal">
        <div class="modal">
            <div class="modal-header">
                <h3>JSON 출력</h3>
                <button class="modal-close" onclick="closeJsonModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p style="margin-bottom:12px;color:var(--text-dim)">아래 JSON을 book_metadata.json에 저장하세요.</p>
                <div class="json-output" id="jsonOutput"></div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="downloadJSON()">⬇️ 다운로드</button>
                <button class="btn btn-primary" onclick="copyJSON()">📋 복사</button>
            </div>
        </div>
    </div>

    <!-- Person Modal -->
    <div class="modal-overlay" id="personModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="personModalTitle">인물 추가</h3>
                <button class="modal-close" onclick="closePersonModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editingPersonName">
                <div class="form-section">
                    <div class="form-section-header">인물 정보</div>
                    <div class="form-section-body">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">이름 *</label>
                                <input type="text" class="form-input" id="personName" placeholder="예: 주희">
                            </div>
                            <div class="form-group">
                                <label class="form-label">생몰연도</label>
                                <input type="text" class="form-input" id="personPeriod" placeholder="예: 1130-1200 또는 BC 551-BC 479">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">역할 (복수 선택 가능)</label>
                            <div style="display:flex; gap:16px; margin-top:8px">
                                <label><input type="checkbox" id="roleAuthor" value="author"> 저자</label>
                                <label><input type="checkbox" id="roleCommentator" value="commentator"> 주석가</label>
                                <label><input type="checkbox" id="roleCompiler" value="compiler"> 편집자</label>
                                <label><input type="checkbox" id="roleTranslator" value="translator"> 역자</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closePersonModal()">취소</button>
                <button class="btn btn-primary" onclick="savePerson()">저장</button>
            </div>
        </div>
    </div>

    <!-- Layer Type Modal -->
    <div class="modal-overlay" id="layerTypeModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="layerTypeModalTitle">레이어 타입 추가</h3>
                <button class="modal-close" onclick="closeLayerTypeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editingLayerTypeId">
                <div class="form-section">
                    <div class="form-section-header">레이어 타입 정보</div>
                    <div class="form-section-body">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">ID *</label>
                                <input type="text" class="form-input" id="layerTypeId" placeholder="예: 경">
                            </div>
                            <div class="form-group">
                                <label class="form-label">한자</label>
                                <input type="text" class="form-input" id="layerTypeHanja" placeholder="예: 經">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">설명</label>
                            <input type="text" class="form-input" id="layerTypeDesc" placeholder="예: 원경전">
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeLayerTypeModal()">취소</button>
                <button class="btn btn-primary" onclick="saveLayerType()">저장</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <input type="file" id="fileInput" accept=".json" style="display:none">

    <script>
        // State
        let data = { books: {}, people: {}, layer_types: [] };
        let currentView = 'books';
        let currentAuthors = [];
        let currentTranslators = [];
        let currentLayers = [];

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            loadDefaultData();
            setupListeners();
        });

        function loadDefaultData() {
            fetch('book_metadata.json')
                .then(r => r.json())
                .then(d => { data = d; render(); })
                .catch(() => { data = getDefault(); render(); });
        }

        function getDefault() {
            return {
                books: {},
                people: { "한국고전번역원": { role: ["translator"] } },
                layer_types: [
                    { id: "경", hanja: "經", desc: "원경전" },
                    { id: "전", hanja: "傳", desc: "경의 1차 해석" },
                    { id: "본문", hanja: "本文", desc: "일반 원문" },
                    { id: "주석", hanja: "注釋", desc: "일반 주석" }
                ],
                default_translator: "한국고전번역원"
            };
        }

        function setupListeners() {
            document.getElementById('searchBox').addEventListener('input', renderList);
            document.querySelectorAll('.nav-item').forEach(el => {
                el.addEventListener('click', () => switchView(el.dataset.view));
            });
            document.getElementById('fileInput').addEventListener('change', handleFile);
        }

        function switchView(view) {
            currentView = view;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.view === view));
            document.getElementById('mainTitle').textContent = { books: '서목 목록', people: '인물 목록', layers: '레이어 타입' }[view];
            render();
        }

        function render() {
            renderList();
            populateSelects();
        }

        function renderList() {
            const search = document.getElementById('searchBox').value.toLowerCase();
            const list = document.getElementById('sidebarList');
            list.innerHTML = '';

            if (currentView === 'books') {
                Object.entries(data.books || {})
                    .filter(([n]) => !search || n.toLowerCase().includes(search))
                    .sort((a, b) => a[0].localeCompare(b[0], 'ko'))
                    .forEach(([name, d]) => {
                        list.innerHTML += `<div class="list-item" onclick="selectBook('${name}')">
                            <div><div class="list-item-name">${name}</div>
                            <div class="list-item-meta">${(d.author || []).join(', ')}</div></div>
                            <span style="color:var(--text-dim)">${d.sibu || ''}</span>
                        </div>`;
                    });
            } else if (currentView === 'people') {
                Object.entries(data.people || {})
                    .filter(([n]) => !search || n.toLowerCase().includes(search))
                    .sort((a, b) => a[0].localeCompare(b[0], 'ko'))
                    .forEach(([name, d]) => {
                        list.innerHTML += `<div class="list-item" onclick="selectPerson('${name}')">
                            <div><div class="list-item-name">${name}</div>
                            <div class="list-item-meta">${d.period || ''}</div></div>
                        </div>`;
                    });
            } else if (currentView === 'layers') {
                (data.layer_types || []).forEach((lt, i) => {
                    list.innerHTML += `<div class="list-item" onclick="selectLayerType('${lt.id}')">
                        <div><div class="list-item-name">${lt.id} (${lt.hanja})</div>
                        <div class="list-item-meta">${lt.desc}</div></div>
                    </div>`;
                });
            }
        }

        function populateSelects() {
            const authorSel = document.getElementById('authorSelect');
            const transSel = document.getElementById('translatorSelect');
            authorSel.innerHTML = '<option value="">선택...</option>';
            transSel.innerHTML = '<option value="">선택...</option>';

            Object.entries(data.people || {}).forEach(([name, d]) => {
                const roles = d.role || [];
                if (roles.some(r => ['author', 'commentator', 'compiler'].includes(r))) {
                    authorSel.innerHTML += `<option value="${name}">${name}</option>`;
                }
                if (roles.includes('translator')) {
                    transSel.innerHTML += `<option value="${name}">${name}</option>`;
                }
            });
        }

        function selectBook(name) {
            const d = data.books[name];
            const content = document.getElementById('mainContent');
            const layers = d.layers || [];
            const layersHtml = layers.length ? layers.map(l => `
                <div class="layer-card">
                    <div class="layer-type-badge ${l.type}">${l.type}</div>
                    <div>${(l.author || []).join(', ')}</div>
                    <div style="color:var(--text-dim)">${l.period || ''} ${l.period_detail || ''}</div>
                </div>
            `).join('') : '<p style="color:var(--text-dim)">단층 텍스트 (레이어 없음)</p>';

            content.innerHTML = `
                <div class="form-section">
                    <div class="form-section-header">
                        <span>${name}</span>
                        <div>
                            <button class="btn btn-sm" onclick="editBook('${name}')">✏️ 편집</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteBook('${name}')">🗑️ 삭제</button>
                        </div>
                    </div>
                    <div class="form-section-body">
                        <div class="form-row">
                            <div class="form-group"><label class="form-label">저자</label><div>${(d.author || []).map(a => `<span class="tag">${a}</span>`).join(' ')}</div></div>
                            <div class="form-group"><label class="form-label">시대</label><div>${d.period || '-'} ${d.period_detail ? '(' + d.period_detail + ')' : ''}</div></div>
                            <div class="form-group"><label class="form-label">사부</label><div>${d.sibu || '-'}</div></div>
                        </div>
                        <div class="form-group"><label class="form-label">역자</label><div>${(d.translator || []).map(t => `<span class="tag">${t}</span>`).join(' ')}</div></div>
                    </div>
                </div>
                <div class="form-section">
                    <div class="form-section-header">텍스트 레이어</div>
                    <div class="form-section-body">${layersHtml}</div>
                </div>
            `;
        }

        function selectPerson(name) {
            const d = data.people[name];
            const content = document.getElementById('mainContent');
            content.innerHTML = `
                <div class="form-section">
                    <div class="form-section-header">
                        <span>${name}</span>
                        <button class="btn btn-sm btn-danger" onclick="deletePerson('${name}')">🗑️ 삭제</button>
                    </div>
                    <div class="form-section-body">
                        <div class="form-row">
                            <div class="form-group"><label class="form-label">생몰연도</label><div>${d.period || '-'}</div></div>
                            <div class="form-group"><label class="form-label">역할</label><div>${(d.role || []).join(', ')}</div></div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Open Add Modal based on current view
        function openAddModal() {
            if (currentView === 'books') {
                openAddBookModal();
            } else if (currentView === 'people') {
                openAddPersonModal();
            } else if (currentView === 'layers') {
                openAddLayerTypeModal();
            }
        }

        // Book Modal
        function openAddBookModal() {
            document.getElementById('bookModalTitle').textContent = '서목 추가';
            document.getElementById('editingBookName').value = '';
            document.getElementById('bookName').value = '';
            document.getElementById('bookName').disabled = false;
            currentAuthors = [];
            currentTranslators = [];
            currentLayers = [];
            renderTags();
            renderLayers();
            document.getElementById('bookModal').classList.add('active');
        }

        function editBook(name) {
            const d = data.books[name];
            document.getElementById('bookModalTitle').textContent = '서목 편집';
            document.getElementById('editingBookName').value = name;
            document.getElementById('bookName').value = name;
            document.getElementById('bookName').disabled = true;
            document.getElementById('bookSibu').value = d.sibu || '經';
            document.getElementById('bookPeriod').value = d.period || '남송시대';
            document.getElementById('bookPeriodDetail').value = d.period_detail || '';
            currentAuthors = [...(d.author || [])];
            currentTranslators = [...(d.translator || [])];
            currentLayers = [...(d.layers || [])];
            renderTags();
            renderLayers();
            document.getElementById('bookModal').classList.add('active');
        }

        function closeBookModal() { document.getElementById('bookModal').classList.remove('active'); }

        function addAuthor() {
            const sel = document.getElementById('authorSelect').value;
            const inp = document.getElementById('authorInput').value.trim();
            const val = sel || inp;
            if (val && !currentAuthors.includes(val)) {
                currentAuthors.push(val);
                if (inp && !data.people[inp]) data.people[inp] = { role: ['author'] };
                renderTags();
                populateSelects();
            }
            document.getElementById('authorInput').value = '';
        }

        function addTranslator() {
            const sel = document.getElementById('translatorSelect').value;
            const inp = document.getElementById('translatorInput').value.trim();
            const val = sel || inp;
            if (val && !currentTranslators.includes(val)) {
                currentTranslators.push(val);
                if (inp && !data.people[inp]) data.people[inp] = { role: ['translator'] };
                renderTags();
                populateSelects();
            }
            document.getElementById('translatorInput').value = '';
        }

        function removeAuthor(name) { currentAuthors = currentAuthors.filter(a => a !== name); renderTags(); }
        function removeTranslator(name) { currentTranslators = currentTranslators.filter(t => t !== name); renderTags(); }

        function renderTags() {
            document.getElementById('authorTags').innerHTML = currentAuthors.map(a =>
                `<span class="tag">${a}<span class="tag-remove" onclick="removeAuthor('${a}')">&times;</span></span>`
            ).join('');
            document.getElementById('translatorTags').innerHTML = currentTranslators.map(t =>
                `<span class="tag">${t}<span class="tag-remove" onclick="removeTranslator('${t}')">&times;</span></span>`
            ).join('');
        }

        // Layers
        function addLayer() {
            currentLayers.push({ type: '본문', author: [], period: '', period_detail: '' });
            renderLayers();
        }

        function removeLayer(idx) {
            currentLayers.splice(idx, 1);
            renderLayers();
        }

        function renderLayers() {
            const container = document.getElementById('layersContainer');
            if (currentLayers.length === 0) {
                container.innerHTML = '<p style="color:var(--text-dim);font-size:0.875rem">다층 텍스트의 경우 레이어를 추가하세요</p>';
                return;
            }

            const layerTypes = (data.layer_types || []).map(lt => `<option value="${lt.id}">${lt.id} (${lt.hanja})</option>`).join('');

            container.innerHTML = currentLayers.map((l, i) => `
                <div class="layer-card">
                    <select class="form-select" onchange="updateLayerType(${i}, this.value)">
                        ${layerTypes.replace(`value="${l.type}"`, `value="${l.type}" selected`)}
                    </select>
                    <input type="text" class="form-input" value="${(l.author || []).join(', ')}" placeholder="저자" onchange="updateLayerAuthor(${i}, this.value)">
                    <input type="text" class="form-input" value="${l.period_detail || ''}" placeholder="연도" onchange="updateLayerPeriod(${i}, this.value)">
                    <button class="btn btn-sm btn-danger" onclick="removeLayer(${i})">×</button>
                </div>
            `).join('');
        }

        function updateLayerType(i, val) { currentLayers[i].type = val; }
        function updateLayerAuthor(i, val) { currentLayers[i].author = val.split(',').map(s => s.trim()).filter(Boolean); }
        function updateLayerPeriod(i, val) { currentLayers[i].period_detail = val; }

        function saveBook() {
            const name = document.getElementById('bookName').value.trim();
            if (!name) { alert('서목명을 입력하세요'); return; }

            data.books[name] = {
                author: currentAuthors.length ? currentAuthors : ['미상'],
                period: document.getElementById('bookPeriod').value,
                period_detail: document.getElementById('bookPeriodDetail').value || null,
                sibu: document.getElementById('bookSibu').value,
                translator: currentTranslators.length ? currentTranslators : [data.default_translator || '한국고전번역원'],
                ...(currentLayers.length ? { layers: currentLayers } : {})
            };

            closeBookModal();
            render();
            showToast('저장되었습니다');
        }

        function deleteBook(name) {
            if (confirm(`"${name}"을(를) 삭제하시겠습니까?`)) {
                delete data.books[name];
                render();
                document.getElementById('mainContent').innerHTML = '<div class="empty-state"><div class="empty-state-icon">📚</div><p>항목을 선택하세요</p></div>';
                showToast('삭제되었습니다');
            }
        }

        function deletePerson(name) {
            if (confirm(`"${name}"을(를) 삭제하시겠습니까?`)) {
                delete data.people[name];
                render();
                showToast('삭제되었습니다');
            }
        }

        // Person Modal
        function openAddPersonModal() {
            document.getElementById('personModalTitle').textContent = '인물 추가';
            document.getElementById('editingPersonName').value = '';
            document.getElementById('personName').value = '';
            document.getElementById('personName').disabled = false;
            document.getElementById('personPeriod').value = '';
            document.getElementById('roleAuthor').checked = false;
            document.getElementById('roleCommentator').checked = false;
            document.getElementById('roleCompiler').checked = false;
            document.getElementById('roleTranslator').checked = false;
            document.getElementById('personModal').classList.add('active');
        }

        function editPerson(name) {
            const d = data.people[name];
            document.getElementById('personModalTitle').textContent = '인물 편집';
            document.getElementById('editingPersonName').value = name;
            document.getElementById('personName').value = name;
            document.getElementById('personName').disabled = true;
            document.getElementById('personPeriod').value = d.period || '';
            const roles = d.role || [];
            document.getElementById('roleAuthor').checked = roles.includes('author');
            document.getElementById('roleCommentator').checked = roles.includes('commentator');
            document.getElementById('roleCompiler').checked = roles.includes('compiler');
            document.getElementById('roleTranslator').checked = roles.includes('translator');
            document.getElementById('personModal').classList.add('active');
        }

        function closePersonModal() { document.getElementById('personModal').classList.remove('active'); }

        function savePerson() {
            const name = document.getElementById('personName').value.trim();
            if (!name) { alert('이름을 입력하세요'); return; }

            const roles = [];
            if (document.getElementById('roleAuthor').checked) roles.push('author');
            if (document.getElementById('roleCommentator').checked) roles.push('commentator');
            if (document.getElementById('roleCompiler').checked) roles.push('compiler');
            if (document.getElementById('roleTranslator').checked) roles.push('translator');

            data.people[name] = {
                ...(document.getElementById('personPeriod').value ? { period: document.getElementById('personPeriod').value } : {}),
                role: roles.length ? roles : ['author']
            };

            closePersonModal();
            render();
            showToast('저장되었습니다');
        }

        // Layer Type Modal
        function openAddLayerTypeModal() {
            document.getElementById('layerTypeModalTitle').textContent = '레이어 타입 추가';
            document.getElementById('editingLayerTypeId').value = '';
            document.getElementById('layerTypeId').value = '';
            document.getElementById('layerTypeId').disabled = false;
            document.getElementById('layerTypeHanja').value = '';
            document.getElementById('layerTypeDesc').value = '';
            document.getElementById('layerTypeModal').classList.add('active');
        }

        function editLayerType(id) {
            const lt = (data.layer_types || []).find(l => l.id === id);
            if (!lt) return;
            document.getElementById('layerTypeModalTitle').textContent = '레이어 타입 편집';
            document.getElementById('editingLayerTypeId').value = id;
            document.getElementById('layerTypeId').value = lt.id;
            document.getElementById('layerTypeId').disabled = true;
            document.getElementById('layerTypeHanja').value = lt.hanja || '';
            document.getElementById('layerTypeDesc').value = lt.desc || '';
            document.getElementById('layerTypeModal').classList.add('active');
        }

        function closeLayerTypeModal() { document.getElementById('layerTypeModal').classList.remove('active'); }

        function saveLayerType() {
            const id = document.getElementById('layerTypeId').value.trim();
            if (!id) { alert('ID를 입력하세요'); return; }

            const hanja = document.getElementById('layerTypeHanja').value.trim();
            const desc = document.getElementById('layerTypeDesc').value.trim();
            const editingId = document.getElementById('editingLayerTypeId').value;

            if (!data.layer_types) data.layer_types = [];

            if (editingId) {
                const idx = data.layer_types.findIndex(l => l.id === editingId);
                if (idx >= 0) data.layer_types[idx] = { id, hanja, desc };
            } else {
                if (data.layer_types.some(l => l.id === id)) {
                    alert('이미 존재하는 ID입니다');
                    return;
                }
                data.layer_types.push({ id, hanja, desc });
            }

            closeLayerTypeModal();
            render();
            showToast('저장되었습니다');
        }

        function deleteLayerType(id) {
            if (confirm(`"${id}" 레이어 타입을 삭제하시겠습니까?`)) {
                data.layer_types = (data.layer_types || []).filter(l => l.id !== id);
                render();
                showToast('삭제되었습니다');
            }
        }

        // JSON
        function exportJSON() {
            const output = { ...data, _last_updated: new Date().toISOString().split('T')[0] };
            document.getElementById('jsonOutput').textContent = JSON.stringify(output, null, 2);
            document.getElementById('jsonModal').classList.add('active');
        }

        function closeJsonModal() { document.getElementById('jsonModal').classList.remove('active'); }

        function copyJSON() {
            navigator.clipboard.writeText(document.getElementById('jsonOutput').textContent);
            showToast('클립보드에 복사되었습니다');
        }

        function downloadJSON() {
            const output = { ...data, _last_updated: new Date().toISOString().split('T')[0] };
            const blob = new Blob([JSON.stringify(output, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'book_metadata.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('다운로드 시작됨');
        }

        function loadFile() { document.getElementById('fileInput').click(); }

        function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    data = JSON.parse(e.target.result);
                    render();
                    showToast('파일을 불러왔습니다');
                } catch (err) { alert('JSON 파싱 오류: ' + err.message); }
            };
            reader.readAsText(file);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
    </script>
</body>

</html>
