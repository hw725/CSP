<!DOCTYPE html>

<html lang="ko">

<head>

    <meta charset="UTF-8">

    <title>SENTENCE 균등(1:1) ↔ 가중(3:1) 라벨 전환 (흑백)</title>

    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

    <style>

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {

            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;

            background: #ffffff;

            min-height: 100vh;

            color: #000;

            padding: 20px;

        }

        .container { max-width: 1200px; margin: 0 auto; }

        h1 {

            text-align: center;

            font-size: 1.8rem;

            margin-bottom: 10px;

            color: #333;

        }

        .subtitle { text-align: center; color: #555; margin-bottom: 20px; }

        #sankey { width: 100%; height: 600px; }

        .stats {

            display: flex;

            justify-content: center;

            gap: 40px;

            margin: 20px 0;

        }

        .stat-item {

            text-align: center;

            padding: 15px 25px;

            background: rgba(0,0,0,0.05);

            border-radius: 10px;

        }

        .stat-value { font-size: 1.5rem; color: #333; }

        .stat-label { font-size: 0.9rem; color: #555; }

    </style>

</head>

<body>

    <div class="container">

        <h1>SENTENCE 균등(1:1) ↔ 가중(3:1) 라벨 전환</h1>

        <p class="subtitle">클러스터 간 데이터 흐름 시각화</p>

        <div class="stats">

            <div class="stat-item">

                <div class="stat-value">Uniform K=3</div>

                <div class="stat-label">왼쪽</div>

            </div>

            <div class="stat-item">

                <div class="stat-value">Weighted K=3</div>

                <div class="stat-label">오른쪽</div>

            </div>

            <div class="stat-item">

                <div class="stat-value">183,322</div>

                <div class="stat-label">총 매칭</div>

            </div>

        </div>

        <div id="sankey"></div>

    </div>

    <script>

        const data = {

            type: "sankey",

            orientation: "h",

            node: {

                pad: 15,

                thickness: 20,

                line: { color: "rgba(0,0,0,0.3)", width: 0.5 },

                label: ["Uniform-p0", "Uniform-p1", "Uniform-p2", "Weighted-p0", "Weighted-p1", "Weighted-p2"],

                color: ["rgba(0, 0, 0, 0.8)", "rgba(85, 85, 85, 0.8)", "rgba(153, 153, 153, 0.8)", "rgba(51, 51, 51, 0.8)", "rgba(102, 102, 102, 0.8)", "rgba(170, 170, 170, 0.8)"]

            },

            link: {

                source: [0, 0, 0, 1, 1, 1, 2, 2, 2],

                target: [3, 4, 5, 3, 4, 5, 3, 4, 5],

                value: [31572, 9231, 12692, 54, 65539, 7488, 159, 13, 56574],

                color: "rgba(100,100,100,0.3)"

            }

        };

        Plotly.newPlot('sankey', [data], {

            paper_bgcolor: 'rgba(0,0,0,0)',

            font: { color: '#000', size: 12 },

            margin: { t: 30, b: 30, l: 30, r: 30 }

        }, { responsive: true });

    </script>

</body>

</html>
