[tool.poetry]
name = "csp"
version = "0.1.0"
description = "Chinese Sentence Processing - Docker Only"
authors = ["hw725 <hw725@g.skku.edu>"]
readme = "readme.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
# 🚨 torch 관련 패키지는 Docker에서 시스템 레벨 설치
# 🚨 Poetry는 torch와 무관한 패키지만 관리
pandas = "*"
openpyxl = "*"
regex = "*"
tqdm = "*"
requests = "^2.31.0"

[tool.poetry.group.dev.dependencies]
jupyter = "*"
black = "*"
isort = "*"
pytest = "*"
pytest-cov = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
