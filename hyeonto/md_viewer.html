<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Deprecated: Markdown Viewer</title>
    <meta http-equiv="refresh" content="0; url=/dashboard.html" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css"
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --panel: #111827;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --border: #1f2937;
        --link: #60a5fa;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f8fafc;
          --panel: #ffffff;
          --text: #0f172a;
          --muted: #475569;
          --border: #e2e8f0;
          --link: #2563eb;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      header {
        position: sticky;
        top: 0;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        padding: 12px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        z-index: 10;
      }

      header a {
        color: var(--link);
        text-decoration: none;
        font-weight: 600;
      }

      .path {
        font-size: 0.85rem;
        color: var(--muted);
        word-break: break-all;
      }

      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 24px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
      }

      .error {
        color: #f87171;
        margin-bottom: 12px;
        font-weight: 600;
      }

      .muted {
        color: var(--muted);
      }

      .content {
        line-height: 1.7;
      }

      .content h1,
      .content h2,
      .content h3 {
        border-bottom: 1px solid var(--border);
        padding-bottom: 6px;
      }

      .content a {
        color: var(--link);
      }

      .content pre {
        background: #0b1220;
        padding: 12px;
        border-radius: 8px;
        overflow-x: auto;
      }

      .content code {
        font-family: "Consolas", "JetBrains Mono", monospace;
      }

      @media print {
        header {
          display: none;
        }
        body {
          background: #fff;
          color: #000;
        }
        .panel {
          border: none;
          padding: 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a
        href="dashboard.html"
        id="dashboardLink"
        >← 대시보드</a
      >
      <div
        class="path"
        id="filePath"
      >
        파일 로딩 중...
      </div>
    </header>
    <main>
      <div class="panel">
        <div
          id="status"
          class="muted"
        >
          마크다운을 불러오는 중...
        </div>
        <div
          id="content"
          class="content"
        ></div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.1/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const fileParam = params.get("file");
      const statusEl = document.getElementById("status");
      const contentEl = document.getElementById("content");
      const pathEl = document.getElementById("filePath");
      const dashboardLink = document.getElementById("dashboardLink");

      // 대시보드 링크 설정
      dashboardLink.href = "dashboard.html";

      if (!fileParam) {
        statusEl.innerHTML = '<div class="error">파일 경로가 없습니다.</div>';
        statusEl.insertAdjacentHTML(
          "beforeend",
          '<div class="muted">md_viewer.html?file=상대경로.md 형식으로 호출하세요.</div>',
        );
      } else {
        // 파일 URL 구성 (현재 위치 기준 상대 경로)
        const fileUrl = fileParam;
        const baseUrl = new URL(window.location.href);
        baseUrl.search = "";
        baseUrl.hash = "";
        const baseDir = baseUrl.href.substring(
          0,
          baseUrl.href.lastIndexOf("/") + 1,
        );

        pathEl.textContent = fileParam;

        if (window.location.protocol === "file:") {
          statusEl.innerHTML =
            '<div class="error">로컬 파일 모드에서는 브라우저가 마크다운을 로드하지 못합니다.</div>' +
            '<div class="muted">터미널에서 다음을 실행하세요:<br><strong>python hyeonto/md_server.py</strong><br>' +
            "그 후 <strong>http://127.0.0.1:8080/dashboard.html</strong> 에서 마크다운을 클릭하세요.</div>";
          return;
        }

        marked.setOptions({
          highlight: function (code, lang) {
            if (lang && hljs.getLanguage(lang)) {
              return hljs.highlight(code, { language: lang }).value;
            }
            return hljs.highlightAuto(code).value;
          },
        });

        // 파일 경로 해석: 상대 경로 또는 절대 경로
        let resolvedUrl = fileUrl;
        if (!fileUrl.startsWith("http")) {
          // 상대 경로인 경우 기본 디렉토리 기준으로 해석
          resolvedUrl = new URL(fileUrl, baseDir).href;
        }

        fetch(resolvedUrl)
          .then((response) => {
            if (!response.ok) {
              throw new Error(
                `파일을 불러오지 못했습니다: ${response.status} ${response.statusText}\n경로: ${fileUrl}`,
              );
            }
            return response.text();
          })
          .then((text) => {
            statusEl.remove();
            contentEl.innerHTML = marked.parse(text);
          })
          .catch((err) => {
            statusEl.innerHTML =
              '<div class="error">마크다운 로드 실패</div>' +
              '<div class="muted">' +
              err.message +
              "<br><br><strong>확인 사항:</strong><br>" +
              "1. 파일 경로가 올바른지 확인<br>" +
              "2. 마크다운 서버가 실행 중인지 확인: python hyeonto/md_server.py<br>" +
              "3. URL이 http://127.0.0.1:8080/ 형식인지 확인" +
              "</div>";
          });
      }
    </script>
  </body>
</html>
