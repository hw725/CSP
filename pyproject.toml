[project]
name = "csp"
version = "0.1.0"
description = "Multilingual NLP project with Korean/Chinese support"
authors = [
    {name = "hw725", email = "hw725@g.skku.edu"}
]
readme = "README.md"
requires-python = ">=3.10.11,<3.14"
dependencies = [
    # 🔥 핵심 필수 패키지만 유지 (Poetry 관리)
    "pandas",               # Excel 파일 처리 필수
    "numpy==1.26.4",       # 수치 계산 필수 (버전 완전 고정)
    "openpyxl",            # Excel 읽기/쓰기 필수
    "regex",               # 텍스트 전처리 필수
    "tqdm",                # 진행률 표시 필수  
    "kiwipiepy (>=0.21.0,<0.22.0)",  # 한국어 토크나이저
    "stanza (>=1.8.0,<2.0.0)",       # 한국어 번역문 분석
    "supar (>=1.1.4,<2.0.0)",        # 한문 구문 분석
    "ipykernel (>=6.30.1,<7.0.0)",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipykernel", 
    "black",
    "isort",
    "pytest",
    "pytest-cov",
]

[tool.poetry]
package-mode = false

# 🚨 CSP GPU 환경 완전 고정 버전 (성공 확인됨!)
# ====================================================
# 
# ⚠️ 절대 변경하지 마세요! 이 버전들은 테스트를 통과했습니다.
#
# 1️⃣ Poetry 기본: poetry install
# 2️⃣ PyTorch CUDA (고정): pip install torch==2.2.0+cu118 torchvision==0.17.0+cu118 torchaudio==2.2.0+cu118 --index-url https://download.pytorch.org/whl/cu118
# 3️⃣ FlagEmbedding (고정): pip install FlagEmbedding==1.2.11
# 4️⃣ 빠른 복원: pip install -r requirements_gpu_success.txt
#
# 🎯 성공 환경:
# - PyTorch: 2.2.0+cu118 (CUDA 지원)
# - transformers: 4.55.3
# - FlagEmbedding: 1.2.11
# - NumPy: 2.1.2 (호환 확인됨)
# - accelerate: 1.10.0
#
# 📋 상세: etc/dependency_tree.ipynb의 마지막 셀 참조

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
