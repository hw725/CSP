<html lang="ko">

<head>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            --bg: #1a1a2e;
            --text: #fff;
            --hanja: #000000;
            --hyeonto: #CCCCCC;
            --link-color: #555;
            --overlay-bg: rgba(0, 0, 0, 0.5);
            --tooltip-bg: rgba(0, 0, 0, 0.8);
        }

        [data-theme="light"] {
            --bg: #ffffff;
            --text: #000000;
            --hanja: #000000;
            --hyeonto: #ffffff;
            --hyeonto-stroke: #000000;
            --link-color: #666;
            --overlay-bg: rgba(255, 255, 255, 0.95);
            --tooltip-bg: rgba(255, 255, 255, 0.95);
        }

        /* 인쇄 전용 스타일 */
        @media print {
            body {
                background: white !important;
                color: black !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .theme-toggle {
                display: none !important;
            }

            h1 {
                color: black !important;
            }

            .legend,
            .info {
                background: white !important;
                border: 2px solid black !important;
                color: black !important;
            }

            .legend-color {
                border: 2px solid black !important;
            }

            .node-hanja {
                fill: #000 !important;
            }

            .node-hyeonto {
                fill: #888 !important;
            }

            .link {
                stroke: #666 !important;
            }

            text {
                fill: black !important;
            }
        }

        body {
            font-family: 'Pretendard', sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            transition: background 0.3s, color 0.3s;
        }

        #network {
            width: 100%;
            height: 100vh;
        }

        .node-hanja {
            fill: var(--hanja);
        }

        .node-hyeonto {
            fill: var(--hyeonto);
            stroke: var(--hyeonto-stroke, transparent);
            stroke-width: 2;
        }

        .link {
            stroke: var(--link-color);
            stroke-opacity: 0.6;
        }

        .tooltip {
            position: absolute;
            background: var(--tooltip-bg);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            pointer-events: none;
            border: 1px solid var(--link-color);
        }

        h1 {
            position: absolute;
            top: 10px;
            left: 20px;
            margin: 0;
            font-size: 1.5rem;
        }

        .legend {
            position: absolute;
            top: 50px;
            left: 20px;
            background: var(--overlay-bg);
            padding: 10px 15px;
            border-radius: 8px;
        }

        [data-theme="light"] .legend {
            border: 1px solid #333;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: var(--overlay-bg);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        [data-theme="light"] .info {
            border: 1px solid #333;
        }

        .theme-toggle {
            position: fixed;
            top: 10px;
            right: 20px;
            z-index: 1000;
            background: var(--overlay-bg);
            border: 1px solid var(--link-color);
            border-radius: 50px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 1.2em;
        }

        .legend-hanja {
            background: var(--hanja);
        }

        .legend-hyeonto {
            background: var(--hyeonto);
            border: 2px solid var(--hyeonto-stroke, transparent);
            box-sizing: border-box;
        }

        .node-label {
            fill: var(--text);
        }
    </style>
</head>

        const width = window.innerWidth;
        const height = window.innerHeight;

        const svg = d3.select("#network")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        const simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(links).id(d => d.id).distance(80))
            .force("charge", d3.forceManyBody().strength(-200))
            .force("center", d3.forceCenter(width / 2, height / 2));

        const link = svg.append("g")
            .selectAll("line")
            .data(links)
            .join("line")
            .attr("class", "link")
            .attr("stroke-width", d => Math.sqrt(d.value / 100));

        const node = svg.append("g")
            .selectAll("circle")
            .data(nodes)
            .join("circle")
            .attr("r", d => d.type === 'hanja' ? 12 : 8)
            .attr("class", d => d.type === 'hanja' ? 'node-hanja' : 'node-hyeonto')
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended));

        const label = svg.append("g")
            .selectAll("text")
            .data(nodes)
            .join("text")
            .text(d => d.id)
            .attr("font-size", d => d.type === 'hanja' ? 14 : 11)
            .attr("class", "node-label")
            .attr("text-anchor", "middle")
            .attr("dy", d => d.type === 'hanja' ? -18 : -12);

        const tooltip = d3.select(".tooltip");

        node.on("mouseover", function (event, d) {
            const connections = links.filter(l => l.source.id === d.id || l.target.id === d.id);
            tooltip
                .style("display", "block")
                .style("left", (event.pageX + 10) + "px")
                .style("top", (event.pageY + 10) + "px")
                .html(`<strong>${d.id}</strong> (${d.type})<br>연결: ${connections.length}개`);
        })
            .on("mouseout", function () {
                tooltip.style("display", "none");
            });

        simulation.on("tick", () => {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);

            node
                .attr("cx", d => d.x)
                .attr("cy", d => d.y);

            label
                .attr("x", d => d.x)
                .attr("y", d => d.y);
        });

        function dragstarted(event) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            event.subject.fx = event.subject.x;
            event.subject.fy = event.subject.y;
        }

        function dragged(event) {
            event.subject.fx = event.x;
            event.subject.fy = event.y;
        }

        function dragended(event) {
            if (!event.active) simulation.alphaTarget(0);
            event.subject.fx = null;
            event.subject.fy = null;
        }

        // 테마 토글 기능
        const themeToggle = document.getElementById('themeToggle');
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            themeToggle.textContent = theme === 'light' ? '🌙' : '☀️';
            label.attr("fill", theme === 'light' ? '#000' : '#fff');
            localStorage.setItem('hyeonto-theme', theme);
        }
        const savedTheme = localStorage.getItem('hyeonto-theme') || 'dark';
        if (savedTheme === 'light') setTheme('light');
        themeToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            setTheme(current === 'light' ? 'dark' : 'light');
        });
    </script>

    // 흑백 인쇄 최적화: 클러스터별 마커 심볼 지정
    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
            const plots = document.querySelectorAll('.plotly-graph-div, [id^="sankey"], #plot, .js-plotly-plot');
            plots.forEach(function(plot) {
                if (plot._fullData) {
                    const symbols = ['circle', 'square', 'diamond', 'triangle-up', 'cross', 'star', 'hexagon', 'pentagon'];
                    plot._fullData.forEach(function(trace, idx) {
                        if (trace.mode && trace.mode.includes('markers')) {
                            const update = {
                                'marker.symbol': symbols[idx % symbols.length],
                                'marker.size': 8,
                                'marker.line.width': 1.5,
                                'marker.line.color': '#000000'
                            };
                            Plotly.restyle(plot, update, [idx]);
                        }
                    });
                }
            });
        }, 500);
    });
    </script>
    

    <script>
    // 흑백 인쇄 최적화: 클러스터별 마커 심볼 + 명도 차이 극대화
    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
            const plots = document.querySelectorAll('.plotly-graph-div, [id^="sankey"], #plot, .js-plotly-plot');
            plots.forEach(function(plot) {
                if (plot._fullData) {
                    // 심볼: 원, 사각, 다이아, 삼각, X, 별, 육각, 오각
                    const symbols = ['circle', 'square', 'diamond', 'triangle-up', 'cross', 'star', 'hexagon', 'pentagon'];
                    // 명도: 검정(0%), 진회색(40%), 밝은회색(75%), 흰색(95%)
                    const colors = ['#000000', '#666666', '#BBBBBB', '#EEEEEE', '#333333', '#999999', '#DDDDDD', '#444444'];
                    
                    plot._fullData.forEach(function(trace, idx) {
                        if (trace.mode && trace.mode.includes('markers')) {
                            const update = {
                                'marker.symbol': symbols[idx % symbols.length],
                                'marker.color': colors[idx % colors.length],
                                'marker.size': 10,
                                'marker.line.width': 2,
                                'marker.line.color': '#000000',
                                'marker.opacity': 0.9
                            };
                            Plotly.restyle(plot, update, [idx]);
                        }
                    });
                }
            });
        }, 500);
    });
    </script>
