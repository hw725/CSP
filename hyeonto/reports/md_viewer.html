<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Markdown Viewer Redirect</title>
    <meta
      http-equiv="refresh"
      content="0"
    />
    <style>
      body {
        font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
        margin: 40px;
        color: #111827;
      }
      a {
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <p>마크다운 뷰어로 이동 중입니다...</p>
    <p>
      <a
        id="targetLink"
        href="../md_viewer.html"
        >수동으로 이동</a
      >
    </p>
    <script>
      const params = new URLSearchParams(window.location.search);
      const fileParam = params.get("file");
      const target = new URL("../md_viewer.html", window.location.href);
      if (fileParam) {
        target.searchParams.set("file", fileParam);
      }
      const link = document.getElementById("targetLink");
      link.href = target.href;
      window.location.replace(target.href);
    </script>
  </body>
</html>
